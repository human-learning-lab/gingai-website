<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0D0B08"/>

  <!-- Brazilian green outer ring arc (top-left) -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#009C3B" stroke-width="1.5" stroke-dasharray="20 62" stroke-dashoffset="-5" opacity="0.5"/>

  <!-- Yellow diamond accent (bottom-right) -->
  <polygon points="22,19 26,22 22,25 18,22" fill="#FEDD00" opacity="0.85"/>

  <!-- Bold G -->
  <text
    x="15.5"
    y="21"
    font-family="'Barlow Condensed', Arial Black, sans-serif"
    font-weight="800"
    font-size="17"
    fill="#00A651"
    text-anchor="middle"
    letter-spacing="-0.5"
  >G</text>

  <!-- Small yellow dot (AI indicator) -->
  <circle cx="22" cy="10" r="2.5" fill="#FEDD00"/>
</svg>
